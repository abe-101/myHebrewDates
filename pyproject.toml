[project]
name = "my-hebrew-dates"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "pillow==12.3.0",
    "rcssmin==1.3.0",
    "argon2-cffi==25.1.0",
    "whitenoise==6.12.0",
    "redis==6.4.0",
    "hiredis==3.5.0",
    "celery[redis]==5.7.0",
    "django-celery-beat==2.9.0",
    "pyluach==2.3.0",
    "icalendar==7.3.0",
    "python-json-logger==4.2.0",
    "django==6.0.9",
    "django-environ==0.14.0",
    "django-allauth[mfa,socialaccount]==65.22.1",
    "django-crispy-forms==2.7",
    "crispy-bootstrap5==2026.9",
    "django-compressor==4.7.0",
    "django-redis==7.0.0",
    "django-htmx==1.29.0",
    "django-libsass==0.9",
    "djangorestframework==3.18.3",
    "django-cors-headers==4.9.0",
    "drf-spectacular==0.30.0",
    "django-htmx-modal-forms==0.4.0",
    "django-htmx-messages==0.1.1",
    "gunicorn==26.2.0",
    "psycopg2-binary==2.9.13",
    "sentry-sdk==2.75.0",
    "django-storages[s3]==1.14.6",
    "django-anymail[mailjet]==15.2",
    "posthog==7.91.2",
    "django-health-check==4.11.4",
]

[dependency-groups]
dev = [
    "watchdog==6.0.0",
    "werkzeug[watchdog]==3.1.9",
    "ipdb==0.13.13",
    "psycopg[binary]==3.3.9",
    "watchfiles==1.3.0",
    "rich==15.0.0",
    "mypy==2.4.1",
    "django-stubs[compatible-mypy]==6.1.2",
    "pytest==9.2.0",
    "pytest-sugar==1.1.1",
    "time-machine==3.6.0",
    "djangorestframework-stubs==3.18.2",
    "sphinx==9.2.0",
    "sphinx-autobuild==2025.8.25",
    "ruff==0.17.6",
    "coverage==7.17.3",
    "djlint==1.46.4",
    "pre-commit==4.7.0",
    "factory-boy==3.3.3",
    "django-debug-toolbar==8.0.0",
    "django-coverage-plugin==3.2.2",
    "django-browser-reload==1.21.0",
    "pytest-django==4.14.0",
    "railway-sdk==0.7.0",
    "django-extensions==4.1",
]

# ==== pytest ====
[tool.pytest.ini_options]
minversion = "6.0"
addopts = "--ds=config.settings.test --reuse-db --import-mode=importlib"
python_files = [
    "tests.py",
    "test_*.py",
]
markers = [
    "time_ticks: let real time pass instead of holding the clock still",
]

# ==== Coverage ====
[tool.coverage.run]
include = ["my_hebrew_dates/**"]
omit = ["*/migrations/*", "*/tests/*"]
plugins = ["django_coverage_plugin"]

# ==== mypy ====
[tool.mypy]
python_version = "3.14"
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
plugins = [
    "mypy_django_plugin.main",
    "mypy_drf_plugin.main",
]

[[tool.mypy.overrides]]
# Django migrations should not produce any errors:
module = "*.migrations.*"
ignore_errors = true

[tool.django-stubs]
django_settings_module = "config.settings.test"

# ==== djLint ====
[tool.djlint]
blank_line_after_tag = "load,extends"
close_void_tags = true
format_css = true
format_js = true
# TODO: remove T002 when fixed https://github.com/djlint/djLint/issues/687
ignore = "H006,H030,H031,T002"
include = "H017,H035"
indent = 2
max_line_length = 119
profile = "django"

[tool.djlint.css]
indent_size = 2

[tool.djlint.js]
indent_size = 2

[tool.ruff]
target-version = "py314"
# Exclude a variety of commonly ignored directories.
extend-exclude = [
    "*/migrations/*.py",
    "staticfiles/*",
]

[tool.ruff.lint]
select = [
  "F",
  "E",
  "W",
  "C90",
  "I",
  "N",
  "UP",
  "YTT",
  # "ANN", # flake8-annotations: we should support this in the future but 100+ errors atm
  "ASYNC",
  "S",
  "BLE",
  "FBT",
  "B",
  "A",
  "COM",
  "C4",
  "DTZ",
  "T10",
  "DJ",
  "EM",
  "EXE",
  "FA",
  'ISC',
  "ICN",
  "G",
  'INP',
  'PIE',
  "T20",
  'PYI',
  'PT',
  "Q",
  "RSE",
  "RET",
  "SLF",
  "SLOT",
  "SIM",
  "TID",
  "TCH",
  "INT",
  # "ARG", # Unused function argument
  "PTH",
  "ERA",
  "PD",
  "PGH",
  "PL",
  "TRY",
  "FLY",
  # "NPY",
  # "AIR",
  "PERF",
  # "FURB",
  # "LOG",
  "RUF",
]
ignore = [
  "S101", # Use of assert detected https://docs.astral.sh/ruff/rules/assert/
  "RUF012", # Mutable class attributes should be annotated with `typing.ClassVar`
  "SIM102", # sometimes it's better to nest
  "PLC0415", # Django app ready() hooks and Celery signal handlers import late on purpose
]

[tool.ruff.lint.per-file-ignores]
".railway/railway.py" = ["INP001", "E501"]

[tool.ruff.lint.isort]
force-single-line = true
