{% extends "base.html" %}

{% load crispy_forms_tags %}

{% block title %}
  Change my name | My Hebrew Dates
{% endblock title %}
{% block content %}
  <div class="row">
    <div class="col-lg-6">
      <a href="{% url 'users:detail' user.username %}" class="small">My profile</a>
      <h1 class="h2 fw-semibold mt-2 mb-4">Change my name</h1>
      <form method="post" action="{% url 'users:update' %}">
        {% csrf_token %}
        {{ form|crispy }}
        <button type="submit" class="btn btn-primary">Save</button>
        <a href="{% url 'users:detail' user.username %}" class="btn btn-link">Cancel</a>
      </form>
    </div>
  </div>
{% endblock content %}
