<div class="d-flex flex-wrap justify-content-between align-items-start gap-2 mb-3">
  <div>
    <h1 class="h3 fw-semibold mb-1">{{ calendar.name }}</h1>
    <p class="small text-body-secondary mb-0">Time zone: {{ calendar.timezone }}</p>
  </div>
  {% if calendar.owner == request.user %}
    <button type="button"
            hx-get="{% url 'hebcal:update_calendar' pk=calendar.pk %}"
            hx-target="body"
            hx-swap="beforeend"
            class="btn btn-outline-secondary btn-sm">
      <i class="bi bi-gear me-1" aria-hidden="true"></i>Calendar settings
    </button>
  {% endif %}
</div>
