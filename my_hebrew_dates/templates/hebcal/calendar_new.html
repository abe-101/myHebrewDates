{% extends "base.html" %}

{% load crispy_forms_tags %}

{% block content %}
  <div class="container mt-4">
    <div class="row justify-content-center">
      <div class="col-12 col-md-8">
        <!-- Adjusts width based on screen size -->
        <div class="card">
          <div class="card-body">
            <h1 class="card-title h2">Create a Calendar</h1>
            <p class="card-text lead">Name your calendar — you'll add birthdays, anniversaries, and yahrzeits next.</p>
            <form action="" method="post">
              {% csrf_token %}
              {{ form|crispy }}
              <button class="btn btn-primary" type="submit">Create Calendar</button>
              <a href="{% url 'hebcal:calendar_list' %}"
                 class="btn btn-outline-secondary ms-2">Cancel</a>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
{% endblock content %}
