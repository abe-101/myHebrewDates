{% extends "base.html" %}

{% load crispy_forms_tags %}

{% block title %}
  New calendar
{% endblock title %}
{% block content %}
  <div class="row">
    <div class="col-md-8 col-lg-6">
      <h1 class="h3 mb-2">New calendar</h1>
      <p class="text-body-secondary mb-4">Give it a name your family will recognize, like “Cohen family”.</p>
      <form action="" method="post">
        {% csrf_token %}
        {{ form|crispy }}
        <button class="btn btn-primary" type="submit">Create calendar</button>
      </form>
    </div>
  </div>
{% endblock content %}
