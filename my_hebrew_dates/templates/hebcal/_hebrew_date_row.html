<tr id="hebrew-date-{{ hebrew_date.pk }}">
  <td>{{ hebrew_date.get_formatted_name }}</td>
  <td>{{ hebrew_date.get_day_display }}</td>
  <td>{{ hebrew_date.get_month_display }}</td>
  <td>
    <span class="me-1">{{ hebrew_date.event_type }}</span>{{ hebrew_date.get_event_type_display }}
  </td>
  <td class="text-nowrap">
    <button type="button"
            hx-get="{% url 'hebcal:edit_hebrew_date_htmx' uuid=hebrew_date.calendar.uuid pk=hebrew_date.pk %}"
            hx-target="closest tr"
            hx-swap="outerHTML settle:1s"
            class="btn btn-sm btn-outline-secondary"
            title="Edit {{ hebrew_date.name }}"
            aria-label="Edit {{ hebrew_date.name }}">
      <i class="bi bi-pencil"></i>
      <span class="d-none d-md-inline">Edit</span>
    </button>
    <button type="button"
            hx-post="{% url 'hebcal:delete_hebrew_date_htmx' uuid=hebrew_date.calendar.uuid pk=hebrew_date.pk %}"
            hx-target="closest tr"
            hx-swap="outerHTML settle:1s"
            hx-confirm="Are you sure you want to delete {{ hebrew_date.get_formatted_name }}?"
            class="btn btn-sm btn-outline-danger"
            title="Delete {{ hebrew_date.name }}"
            aria-label="Delete {{ hebrew_date.name }}">
      <i class="bi bi-trash"></i>
      <span class="d-none d-md-inline">Delete</span>
    </button>
  </td>
</tr>
